<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>Gerador do ícone (512x512)</title>
<!--
  Fonte do ícone do site — img/icon-512.png.
  Para regerar: abra no Chrome com a tela em 512x512 e salve o print
  como img/icon-512.png. O favicon do site é SVG inline (não precisa
  de arquivo), este PNG é usado quando alguém salva o site na tela
  inicial do celular.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:512px;height:512px;overflow:hidden}
body{
  background:linear-gradient(135deg,#14A39B 0%,#0F8A85 52%,#0B6E6A 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit',system-ui,sans-serif;
}
.mark{position:relative;width:512px;height:512px;display:flex;align-items:center;justify-content:center}
.mark::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(360px 300px at 26% 12%, rgba(255,255,255,.28), transparent 62%);
}
svg{width:250px;height:250px;stroke:#fff;stroke-width:2.9;stroke-linecap:round;fill:none;position:relative;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.28))}
</style>
</head>
<body>
<div class="mark"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
</body>
</html>
